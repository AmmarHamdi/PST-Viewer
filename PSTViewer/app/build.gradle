plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pstviewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.pstviewer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Required for java-libpst (uses NIO, which needs desugaring on older APIs)
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // Enable core library desugaring so java.nio works on API < 26
        coreLibraryDesugaringEnabled true
    }

    packagingOptions {
        // java-libpst bundles some duplicate META-INF files
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    // PST parsing
    implementation 'com.pff:java-libpst:0.9.3'

    // UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Desugaring for older Android
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
